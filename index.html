<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Find recipes using ingredients you already have." />
  <title>Recipe Finder App</title>

  <script type="module" crossorigin src="/Final-Project-Recipe-Finder/assets/main-B2DtcB5E.js"></script>
  <link rel="modulepreload" crossorigin href="/Final-Project-Recipe-Finder/assets/styles-DJmC4YB5.js">
  <link rel="stylesheet" crossorigin href="/Final-Project-Recipe-Finder/assets/styles-IyydBr3U.css">
</head>

<body>

  <header class="main-header">
    <h1>🍽️ Recipe Finder</h1>
    <nav class="nav-container">
      <a href="/Final-Project-Recipe-Finder/">Home</a>
      <a href="/Final-Project-Recipe-Finder/favorites.html">⭐ Favorites</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h2>Find Your Next Meal 🍽️</h2>

      <p class="app-description">
        Discover delicious recipes using ingredients you already have.
      </p>

      <div class="search-container">
        <select id="categoryFilter">
          <option value="">All Categories</option>
        </select>

        <input type="text" id="searchInput" placeholder="Search recipes..." />
        <button id="searchBtn">Search</button>
        <button id="randomBtn">🎲 Random Recipe</button>
        <button id="drinkBtn">🍹 Get a Drink Idea</button>
      </div>
    </section>

    <section id="results"></section>
  </main>

  <footer class="main-footer">
    <p>WDD330 Final Project | © 2026 Recipe Finder</p>
    <p>Built with ❤️ by Jacqueline Mufetu</p>
  </footer>
