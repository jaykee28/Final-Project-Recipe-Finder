<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Find recipes using ingredients you already have. Simple, fast, and smart cooking." />
  <title>Recipe Finder App</title>
  <link rel="stylesheet" href="./src/css/styles.css" />
</head>

<body>

  <header>

    <header class="main-header">
  <div class="nav-container">
    <h1>🍽️ Recipe Finder</h1>
    
    <nav>
      <a href="/Final-Project-Recipe-Finder/">Home</a>
      <a href="/Final-Project-Recipe-Finder/favorites.html">⭐ Favorites</a>
    </nav>
  </div>
</header>
  </header>

    <main>

  <!-- HERO / INTRO -->
  <section class="hero">
    <h2>Find Your Next Meal 🍽️</h2>

    <p class="app-description">
      Discover delicious recipes using ingredients you already have. 
      Search by ingredient or category and save your favorite meals.
    </p>

    <div class="search-container">
      <select id="categoryFilter">
        <option value="">All Categories</option>
      </select>

      <input type="text" id="searchInput" placeholder="Search recipes..." />
      <button id="searchBtn">Search</button>
      <button id="randomBtn">🎲 Random Recipe</button>
      <button id="drinkBtn">🍹 Get a Drink Idea</button>
    </div>
  </section>

  <!-- RESULTS -->
  <section id="results"></section>

  <footer class="main-footer">
    <p>WDD330 Final Project | © 2026 Recipe Finder</p>
    <p>Built with ❤️ by Jacqueline Mufetu</p>
  </footer>

    <script type="module" src="./src/js/main.js"></script>
</body>
</html>
